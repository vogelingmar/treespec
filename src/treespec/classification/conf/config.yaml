train:
  model: resnet50
  model_weights: resnet50_default
  dataset: folder
  dataset_dir_path: /labeled_dataset
  num_classes: 5
  use_ids: false
  epoch_count: 20
  batch_size: 5
  num_workers: 8
  learning_rate: 0.001
  loss_function: cross_entropy
  trained_model_path: /ResNet50_BarkVN-50_50_finetuned
  trained_model_dir_path: /output/trained_models/
  train_augmentations: 
    - name: RandomVerticalFlip
      p: 0.1
    - name: RandomRotation
      degrees: 15
    - name: RandomResizedCrop
      size: [224, 224]
    - name: RandomPerspective
      distortion_scale: 0.3
      p: 0.3
    - name: ElasticTransform
      alpha: 20
      sigma: 20

predict:
  model: resnet50
  model_weights: resnet50_default
  dataset_dir_path: /labeled_dataset
  tree_images_dir_path: /unlabeled_dataset
  input_inventory_path: /inventory/inventory
  output_inventory_path: /output/updated_inventory/inventory
  trained_model_path: /ResNet50_BarkVN-50_50_finetuned
